<div class="glass-card ai-summary-card">
    <div class="ai-summary-header">
        <div class="title-with-badge">
            <span class="ai-icon">✨</span>
            <h3>Resumo Inteligente</h3>
            <span class="badge badge-purple">🤖 Qwen 2.5 (Local)</span>
        </div>

        <button class="btn btn-sparkle" (click)="fetchSummary()" [disabled]="loading()">
            @if (loading()) {
            <span class="spinner">⏳</span> Processando...
            } @else {
            ✨ {{ summary() ? 'Atualizar Resumo' : 'Gerar Resumo com IA' }}
            }
        </button>
    </div>

    @if (summary(); as data) {
    <div class="ai-summary-content">
        <p class="summary-text">{{ data.resumo }}</p>
        @if (data.statusConexao === 'OFFLINE') {
        <div class="alert alert-warning">
            💡 <strong>Dica:</strong> Para gerar novos resumos, certifique-se de executar no terminal:
            <code>ollama run qwen2.5:1.5b</code>
        </div>
        }
    </div>
    }
</div>
