<!-- Fundo escuro com desfoque (Backdrop) -->
<div class="modal-backdrop" (click)="onCancel()">
    <!-- Cartão suspenso do Modal (Impede que o clique interno feche o modal) -->
    <div class="glass-card modal-container" (click)="$event.stopPropagation()">

        <!-- Cabeçalho do Modal -->
        <div class="modal-header">
            <h2>{{ isEditing ? '✏️ Editar Tarefa' : '➕ Nova Tarefa' }}</h2>
            <button class="btn-close" (click)="onCancel()" title="Fechar">✕</button>
        </div>

        <!-- Formulário Reativo -->
        <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="modal-form">

            <!-- Campo: Título -->
            <div class="form-group">
                <label for="titulo" class="form-label">
                    Título da Tarefa <span class="required">*</span>
                </label>
                <input id="titulo" type="text" formControlName="titulo" placeholder="Ex: Estudar Angular Signals & RxJS"
                    class="form-input"
                    [class.is-invalid]="taskForm.get('titulo')?.invalid && taskForm.get('titulo')?.touched" />
                @if (taskForm.get('titulo')?.invalid && taskForm.get('titulo')?.touched) {
                <span class="error-msg">O título é obrigatório e deve ter no mínimo 3 caracteres.</span>
                }
            </div>

            <!-- Campo: Descrição -->
            <div class="form-group">
                <label for="descricao" class="form-label">Descrição (Opcional)</label>
                <textarea id="descricao" formControlName="descricao" rows="3"
                    placeholder="Descreva os detalhes ou observações desta atividade..."
                    class="form-textarea"></textarea>
            </div>

            <!-- Rodapé com os Botões de Ação -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="onCancel()">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">
                    {{ isEditing ? 'Atualizar Tarefa' : 'Criar Tarefa' }}
                </button>
            </div>

        </form>
    </div>
</div>
