<div class="dashboard-header">
    <div class="title-group">
        <h1>Painel de <span class="highlight">Tarefas</span></h1>
        <p class="subtitle">Gerencie suas atividades com eficiência e acompanhe o progresso em tempo real.</p>
    </div>
</div>

<div class="stats-grid">
    <div class="glass-card stat-card">
        <div class="stat-header">
            <span class="stat-title">Total de Tarefas</span>
            <span class="stat-icon pink">📊</span>
        </div>
        <div class="stat-value">{{ totalTasks() }}</div>
        <div class="stat-footer">Tarefas cadastradas no sistema</div>
    </div>

    <div class="glass-card stat-card">
        <div class="stat-header">
            <span class="stat-title">Pendentes</span>
            <span class="stat-icon amber">⏳</span>
        </div>
        <div class="stat-value">{{ pendingTasks() }}</div>
        <div class="stat-footer">Aguardando conclusão</div>
    </div>

    <div class="glass-card stat-card">
        <div class="stat-header">
            <span class="stat-title">Concluídas</span>
            <span class="stat-icon emerald">✅</span>
        </div>
        <div class="stat-value">{{ completedTasks() }}</div>
        <div class="stat-footer">Finalizadas com sucesso</div>
    </div>
</div>

<!-- Renderiza a lista de tarefas e conecta os eventos de ação -->
<app-task-list [tasks]="tasks()" (toggleComplete)="handleToggleComplete($event)"
    (deleteTask)="handleDeleteTask($event)"></app-task-list>
